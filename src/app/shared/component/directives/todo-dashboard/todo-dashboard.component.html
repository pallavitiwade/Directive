<div class="row">
    <div class="col-md-6">
        <app-todo-form [getEditObj]="editTodoObj" (emitUpdateTodo)="emitUpdateTodo($event)"
            (emitNewTodo)="getNewTodo($event)"></app-todo-form>
    </div>
    <div class="col-md-6">
        <app-todo-list (emitEditTodo)="getEditTodo($event)" (emitRemovedId)="getRemovedId($event)"
            [getTodos]="todosArr"></app-todo-list>

    </div>
</div>
