<div class="card">
    <div class="card-body">
    <div class="form-group">
        <label for="Fullname">Fullname</label>
        <input type="text" #Fullname class="form-control">
    </div>

    <div class="form-group">
        <label for="Email">Email</label>
        <input type="text" #Email class="form-control">
    </div>
    <div class="form-group">
        <label for="contact">contact</label>
        <input type="text" #contact class="form-control">
    </div>
    <div class="form-group">
        <label for="IsActive">IsActive</label>
        <select type="text" #IsActive class="form-control">
            <option value="true">yes</option>
            <option value="false">No</option>
        </select>
    </div>

    <button (click)="onStdAdd()" *ngIf="!IsinEditMode" mat-raised-button color="primary" class="btn-block">Add
        Student</button>
    <button (click)="onUpdate()" *ngIf="IsinEditMode" mat-raised-button color="primary" class="btn-block">Update</button>

 </div>
</div>
